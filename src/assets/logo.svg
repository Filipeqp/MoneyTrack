<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Círculo verde fundo -->
  <circle cx="24" cy="24" r="24" fill="#6B8B3E"/>
  
  <!-- Dólar com setas -->
  <g transform="translate(24, 24)">
    <!-- Linha vertical do dólar -->
    <line x1="0" y1="-10" x2="0" y2="10" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Curva superior do dólar -->
    <path d="M -5 -4 Q -5 -7 0 -7 Q 5 -7 5 -4 Q 5 -1 0 0 Q -5 1 -5 4" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Curva inferior do dólar -->
    <path d="M 5 4 Q 5 7 0 7 Q -5 7 -5 4" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Seta para cima-direita -->
    <g>
      <line x1="6" y1="-6" x2="11" y2="-11" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <polygon points="11,-11 9,-8 12,-9" fill="white"/>
    </g>
    
    <!-- Seta para baixo-esquerda -->
    <g>
      <line x1="-6" y1="6" x2="-11" y2="11" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <polygon points="-11,11 -9,8 -12,9" fill="white"/>
    </g>
  </g>
</svg>